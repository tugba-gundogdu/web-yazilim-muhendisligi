<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ders 9 - Sİte ve Harita Gömmek(iframe)</title>
    </head>
    <body>
        <h1>Sİte ve Harita Gömmek</h1>
        <h2>Youtube Videosu Gömme</h2>
        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/lU3EHWwQat8?si=sBVKEFhthzaF_u1v"
            title="YouTube video player"
            frameborder="0"
            allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share;
            "
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
        ></iframe>
        <h2>Google Harita Gömme</h2>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d10441.312232037355!2d29.13097252727782!3d40.92674511579888!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14cac6b10e95e83f%3A0x1f96b68465d3178e!2sMaltepe%20Sahil%20Park%C4%B1!5e0!3m2!1str!2str!4v1793126654753!5m2!1str!2str"
            width="600"
            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
    </body>
</html>
